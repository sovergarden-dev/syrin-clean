name: Validate
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      site_artifact:
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify sources, runtime and packages
        shell: powershell
        run: .\tests\run.ps1
      - name: Check repository residue
        shell: powershell
        run: |
          git diff --exit-code
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (git ls-files --others --exclude-standard) { throw 'Tests left untracked files in the checkout.' }
      - name: Stage the verified release site
        if: inputs.site_artifact
        shell: powershell
        env:
          PAGES_REVISION: ${{ inputs.revision }}
        run: |
          $version=(Get-Content project.json -Raw | ConvertFrom-Json).version
          if ($env:PAGES_REVISION -cne ('refs/tags/'+$version)) { throw 'Release tag and version differ.' }
          python -B -X utf8 tools/publish_site.py "$env:RUNNER_TEMP/syrin-verified-site"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.site_artifact
        with:
          name: syrin-verified-site
          path: ${{ runner.temp }}/syrin-verified-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  portable-artifacts:
    if: inputs.revision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check portable generation
        run: |
          python -B -X utf8 tools/build.py --check
          python -B -X utf8 -m unittest discover -s tests -p test_build.py -k PackagingTests -v
          node tests/page.mjs
          node tests/report.mjs
