name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify sources, runtime and packages
        shell: powershell
        run: .\tests\run.ps1
      - name: Check repository residue
        shell: powershell
        run: |
          git diff --exit-code
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (git ls-files --others --exclude-standard) { throw 'Tests left untracked files in the checkout.' }
