name: Publish Pages
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify generated artifacts
        run: python -B -X utf8 tools/build.py --check
      - name: Verify release identity
        env:
          PAGES_TAG: ${{ github.event.release.tag_name }}
        run: python -c "import json, os; assert json.load(open('project.json'))['version'] == os.environ['PAGES_TAG'], 'Release tag and artifact version differ'"
      - name: Stage public files only
        run: python -B -X utf8 tools/publish_site.py "$RUNNER_TEMP/syrin-pages"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/syrin-pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
