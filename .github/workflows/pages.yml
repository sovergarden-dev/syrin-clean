name: Publish Pages
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/check.yml
    with:
      revision: refs/tags/${{ inputs.release_tag || github.event.release.tag_name }}
      site_artifact: true
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syrin-verified-site
          path: ${{ runner.temp }}/syrin-verified-site
      - name: Verify the published release bytes
        env:
          PAGES_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          PAGES_REPOSITORY: ${{ github.repository }}
          SITE_DIR: ${{ runner.temp }}/syrin-verified-site
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path
          root = Path(os.environ['SITE_DIR'])
          expected = {'index.html', 'report-demo.html', 'version.json', '.nojekyll'}
          assert {path.name for path in root.iterdir()} == expected, 'Unexpected site files'
          assert all(path.is_file() and not path.is_symlink() for path in root.iterdir()), 'Only regular public files are allowed'
          tag = os.environ['PAGES_TAG']
          url = 'https://api.github.com/repos/' + os.environ['PAGES_REPOSITORY'] + '/releases/tags/' + urllib.parse.quote(tag, safe='')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2026-03-10', 'User-Agent': 'Syrin-clean-Pages'})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          assert not release['draft'] and release['tag_name'] == tag, 'Expected a published release'
          assets = {asset['name']: asset for asset in release['assets']}
          metadata = json.loads((root / 'version.json').read_text())
          assert metadata['version'] == tag, 'Site version differs from release'
          for site, asset in [('index.html', 'syrin-clean.html'), ('report-demo.html', 'syrin-clean-report-demo.html')]:
              digest = hashlib.sha256((root / site).read_bytes()).hexdigest()
              assert assets[asset]['digest'] == 'sha256:' + digest, 'Site differs from published asset'
              assert metadata['files'][site] == digest, 'Site metadata differs'
          print('Published HTML digests and the four-file allowlist verified.')
          PY
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/syrin-verified-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
